<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<title>ライブ映像</title>
<style>
:root{
  --bg:#fdf2f6; --card:#ffffff; --text:#5c4a50; --sub:#b08a95;
  --border:#f2d6de; --accent:#e8748f; --accent2:#f7a8bc; --hover:#fdf0f3; --chip:#ffffff;
}
*{box-sizing:border-box}
::selection{background:#f9c6d4}
body{margin:0;font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN",Meiryo,system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.7}
.bgpattern{position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:url('bg.png');background-repeat:repeat;background-size:180px 180px;opacity:.16;animation:bgflow 15s linear infinite}
@keyframes bgflow{from{background-position:0 0}to{background-position:-180px 0}}
@media (prefers-reduced-motion:reduce){.bgpattern{animation:none}}
main{max-width:880px;margin:0 auto;padding:28px 16px 48px}
h1{font-size:1.5rem;margin:0 0 4px;letter-spacing:.05em;font-weight:700}
h1::after{content:"♡";color:var(--accent);margin-left:.35em}
.sub{color:var(--sub);font-size:.95rem;margin:0 0 22px;letter-spacing:.14em}
.panel{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:16px;margin-bottom:16px;box-shadow:0 3px 12px rgba(232,116,143,.08)}
.search{width:100%;padding:11px 18px;font-size:1rem;border:1.5px solid var(--border);border-radius:999px;background:#fffdfa;color:var(--text);font-family:inherit}
.search:focus{outline:none;border-color:var(--accent2);box-shadow:0 0 0 3px rgba(247,168,188,.35)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{padding:5px 14px;border:1px solid var(--border);border-radius:999px;background:var(--chip);color:var(--sub);cursor:pointer;font-size:.85rem;font-family:inherit}
.chip:hover{color:var(--accent);border-color:var(--accent2)}
.chip.active{background:var(--accent);border-color:var(--accent);color:#fff}
.count{color:var(--sub);font-size:.85rem;margin:0 0 8px}
.tablewrap{background:var(--card);border:1px solid var(--border);border-radius:18px;overflow:hidden;box-shadow:0 3px 12px rgba(232,116,143,.08)}
.tablescroll{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:12px 14px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
thead th{font-size:.78rem;color:#c2798d;user-select:none;white-space:nowrap;border-bottom:2px solid var(--accent2);background:#fdf0f4}
th.sortable{cursor:pointer}
tbody tr:hover td{background:var(--hover)}
tbody tr:last-child td{border-bottom:none}
td.date{white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--sub)}
td.title{min-width:180px;font-weight:500}
td.stage{color:var(--sub)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
a.watch{display:inline-block;padding:7px 16px;border-radius:999px;background:linear-gradient(135deg,#f78fa7,#e8748f);color:#fff;text-decoration:none;font-size:.85rem;white-space:nowrap;box-shadow:0 2px 6px rgba(232,116,143,.35)}
a.watch:hover{opacity:.9}
button.copy{padding:6px 14px;border-radius:999px;border:1.5px solid var(--accent2);background:#fff;color:var(--accent);font-size:.85rem;font-family:inherit;cursor:pointer;white-space:nowrap}
button.copy:hover{background:var(--hover)}
.adminbox{border-style:dashed}
.admintitle{margin:0 0 10px;font-weight:700;color:var(--accent)}
.admintitle .linkbtn{margin-left:8px;font-weight:400}
.loginrow{display:flex;gap:8px}
.loginrow .search{flex:1}
.adminbtn{padding:8px 16px;border-radius:999px;border:1.5px solid var(--accent2);background:#fff;color:var(--accent);font-family:inherit;font-size:.85rem;cursor:pointer;white-space:nowrap}
.adminbtn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.adminbtn:hover{opacity:.85}
.pwerr{color:#d64562;font-size:.85rem;margin:8px 0 0}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.formgrid label{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--sub)}
.formgrid input{padding:8px 12px;border:1.5px solid var(--border);border-radius:10px;background:#fffdfa;color:var(--text);font-family:inherit;font-size:.95rem}
.adminactions{display:flex;gap:8px;flex-wrap:wrap}
.adminnote{font-size:.78rem;color:var(--sub);margin:12px 0 0;line-height:1.6}
.linkbtn{background:none;border:none;color:var(--sub);font-family:inherit;font-size:.8rem;cursor:pointer;text-decoration:underline;padding:0}
.badge{display:inline-block;margin-left:6px;padding:2px 8px;border-radius:999px;background:#fff3cd;border:1px solid #eedc9a;color:#8a6d2f;font-size:.7rem;vertical-align:1px;font-weight:400}
button.del{padding:6px 12px;border-radius:999px;border:1.5px solid #e5b8c4;background:#fff;color:#c2566e;font-family:inherit;font-size:.8rem;cursor:pointer;white-space:nowrap}
@media (max-width:560px){.formgrid{grid-template-columns:1fr}}
.empty{padding:40px 16px;text-align:center;color:var(--sub)}
footer{text-align:center;color:var(--sub);font-size:.8rem;padding:8px 16px 24px;letter-spacing:.15em}
footer::before{content:"♡ ";color:var(--accent2)}
footer::after{content:" ♡";color:var(--accent2)}
@media (max-width:560px){
  th,td{padding:9px 9px}
  td.title{min-width:120px}
}
</style>
</head>
<body>
<div class="bgpattern" aria-hidden="true"></div>
<main>
  <header>
    <h1 id="siteTitle">ライブ映像</h1>
    <p class="sub">あぐり</p>
  </header>

  <div class="panel">
    <input id="search" class="search" type="search" placeholder="ライブ名・ステージ・日付で検索…">
    <div id="years" class="chips"></div>
  </div>

  <div id="adminBox" class="panel adminbox" hidden>
    <div id="loginWrap">
      <p class="admintitle">🔐 管理</p>
      <div class="loginrow">
        <input id="pw" class="search" type="password" placeholder="パスワード" autocomplete="current-password">
        <button id="loginBtn" class="adminbtn" type="button">ログイン</button>
      </div>
      <p id="pwErr" class="pwerr" hidden>パスワードが違います</p>
    </div>
    <div id="adminWrap" hidden>
      <p class="admintitle">🔐 管理モード<button id="logoutBtn" class="linkbtn" type="button">ログアウト</button></p>
      <div class="formgrid">
        <label>日付<input id="fDate" type="date"></label>
        <label>ライブ名<input id="fTitle" type="text" placeholder="TIF2026 など"></label>
        <label>ステージ<input id="fStage" type="text" placeholder="SMILE GARDEN など"></label>
        <label>URL<input id="fUrl" type="url" placeholder="https://youtu.be/…"></label>
      </div>
      <div class="adminactions">
        <button id="addBtn" class="adminbtn primary" type="button">一覧に追加</button>
        <button id="csvBtn" class="adminbtn" type="button">CSVをコピー</button>
      </div>
      <p class="adminnote">追加したデータは「未公開」としてこのブラウザにだけ保存されます。「CSVをコピー」→ GitHub の data.csv を全て貼り替えてコミットすると公開されます。</p>
    </div>
  </div>

  <p class="count" id="count"></p>

  <div class="tablewrap">
    <div class="tablescroll">
      <table>
        <thead>
          <tr>
            <th class="sortable" id="thDate" title="クリックで並び順を切り替え">日付 ▾</th>
            <th>ライブ名</th>
            <th>ステージ</th>
            <th>リンク</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div id="empty" class="empty" hidden>該当するデータがありません</div>
  </div>
</main>
<footer>ライブ動画リンク集 <button id="adminToggle" class="linkbtn" type="button">管理</button></footer>

<script>
'use strict';

var state = { rows: [], q: '', year: 'all', desc: true };

// --- 管理モード用(未公開データとログイン状態) ---
var ADMIN_PASS_HASH = '9cd3c6fa532580f3b355b1e94fed0d90282df515ce2dd009f29e4a9aca7ebd26';
var LS_DRAFTS = 'liveLinksDrafts';
var SS_UNLOCKED = 'liveAdminUnlocked';
var drafts = [];
var isAdmin = false;

function loadDrafts() {
  try { drafts = JSON.parse(localStorage.getItem(LS_DRAFTS) || '[]'); } catch (e) { drafts = []; }
}
function saveDrafts() {
  try { localStorage.setItem(LS_DRAFTS, JSON.stringify(drafts)); } catch (e) {}
}
function mergedRows() {
  return state.rows.concat(drafts.map(function (d, i) {
    return { date: d.date, title: d.title, stage: d.stage, url: d.url, draft: true, di: i };
  }));
}

loadDrafts();
if (sessionStorage.getItem(SS_UNLOCKED) === '1') isAdmin = true;

function parseLine(line) {
  var out = [], cur = '', inQ = false;
  for (var i = 0; i < line.length; i++) {
    var c = line[i];
    if (inQ) {
      if (c === '"') {
        if (line[i + 1] === '"') { cur += '"'; i++; }
        else inQ = false;
      } else cur += c;
    } else if (c === '"') {
      inQ = true;
    } else if (c === ',') {
      out.push(cur); cur = '';
    } else cur += c;
  }
  out.push(cur);
  return out.map(function (s) { return s.trim(); });
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

function buildYearChips() {
  var years = [];
  mergedRows().forEach(function (r) {
    var y = r.date.slice(0, 4);
    if (/^\d{4}$/.test(y) && years.indexOf(y) === -1) years.push(y);
  });
  years.sort().reverse();
  var box = document.getElementById('years');
  var all = ['all'].concat(years);
  box.innerHTML = all.map(function (y) {
    var label = y === 'all' ? '全て' : y;
    var cls = 'chip' + (state.year === y ? ' active' : '');
    return '<button type="button" class="' + cls + '" data-year="' + y + '">' + label + '</button>';
  }).join('');
  Array.prototype.forEach.call(box.querySelectorAll('.chip'), function (btn) {
    btn.addEventListener('click', function () {
      state.year = btn.getAttribute('data-year');
      buildYearChips();
      render();
    });
  });
}

function render() {
  var q = state.q.toLowerCase();
  var src = mergedRows();
  var rows = src.filter(function (r) {
    var yearOk = state.year === 'all' || r.date.slice(0, 4) === state.year;
    var textOk = !q || (r.title + ' ' + r.stage + ' ' + r.url + ' ' + r.date).toLowerCase().indexOf(q) !== -1;
    return yearOk && textOk;
  });
  rows.sort(function (a, b) {
    return state.desc ? b.date.localeCompare(a.date) : a.date.localeCompare(b.date);
  });
  document.getElementById('tbody').innerHTML = rows.map(function (r) {
    var badge = r.draft ? '<span class="badge">未公開</span>' : '';
    var del = (r.draft && isAdmin) ? '<button type="button" class="del" data-di="' + r.di + '">削除</button>' : '';
    return '<tr>' +
      '<td class="date">' + esc(r.date) + '</td>' +
      '<td class="title">' + esc(r.title) + badge + '</td>' +
      '<td class="stage">' + esc(r.stage) + '</td>' +
      '<td><div class="actions">' +
      '<a class="watch" href="' + esc(r.url) + '" target="_blank" rel="noopener">視聴する</a>' +
      '<button type="button" class="copy" data-url="' + esc(r.url) + '">コピー</button>' +
      del +
      '</div></td>' +
      '</tr>';
  }).join('');
  document.getElementById('empty').hidden = rows.length > 0;
  var draftCount = rows.filter(function (r) { return r.draft; }).length;
  document.getElementById('count').textContent = rows.length + ' 件 / 全 ' + src.length + ' 件' + (draftCount ? '(未公開 ' + draftCount + ' 件)' : '');
  document.getElementById('thDate').textContent = '日付 ' + (state.desc ? '▾' : '▴');
}

document.getElementById('search').addEventListener('input', function (e) {
  state.q = e.target.value;
  render();
});

document.getElementById('thDate').addEventListener('click', function () {
  state.desc = !state.desc;
  render();
});

document.getElementById('tbody').addEventListener('click', function (e) {
  var target = e.target;
  if (!target || !target.closest) return;
  var del = target.closest('.del');
  if (del) {
    drafts.splice(Number(del.getAttribute('data-di')), 1);
    saveDrafts();
    render();
    return;
  }
  var btn = target.closest('.copy');
  if (!btn) return;
  var url = btn.getAttribute('data-url');

  function done(ok) {
    btn.textContent = ok ? 'コピーしました ✓' : 'コピー失敗';
    setTimeout(function () { btn.textContent = 'コピー'; }, 1500);
  }

  function fallback() {
    var ta = document.createElement('textarea');
    ta.value = url;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (err) {}
    document.body.removeChild(ta);
    done(ok);
  }

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(url).then(function () { done(true); }, fallback);
  } else {
    fallback();
  }
});

// --- 管理モード:ログインとフォーム ---
function sha256hex(text) {
  return crypto.subtle.digest('SHA-256', new TextEncoder().encode(text)).then(function (buf) {
    return Array.prototype.map.call(new Uint8Array(buf), function (b) {
      return ('0' + b.toString(16)).slice(-2);
    }).join('');
  });
}

function updateAdminViews() {
  document.getElementById('loginWrap').hidden = isAdmin;
  document.getElementById('adminWrap').hidden = !isAdmin;
}

document.getElementById('adminToggle').addEventListener('click', function () {
  var box = document.getElementById('adminBox');
  box.hidden = !box.hidden;
  if (!box.hidden) {
    updateAdminViews();
    if (!isAdmin) document.getElementById('pw').focus();
  }
});

function tryLogin() {
  var pwEl = document.getElementById('pw');
  var err = document.getElementById('pwErr');
  if (!window.crypto || !crypto.subtle) {
    err.textContent = 'この環境では管理モードを使えません(GitHub Pages 上でお試しください)';
    err.hidden = false;
    return;
  }
  sha256hex(pwEl.value).then(function (h) {
    if (h === ADMIN_PASS_HASH) {
      isAdmin = true;
      sessionStorage.setItem(SS_UNLOCKED, '1');
      pwEl.value = '';
      err.hidden = true;
      updateAdminViews();
      render();
    } else {
      err.textContent = 'パスワードが違います';
      err.hidden = false;
      pwEl.value = '';
      pwEl.focus();
    }
  });
}

document.getElementById('loginBtn').addEventListener('click', tryLogin);
document.getElementById('pw').addEventListener('keydown', function (e) {
  if (e.key === 'Enter') tryLogin();
});

document.getElementById('logoutBtn').addEventListener('click', function () {
  isAdmin = false;
  sessionStorage.removeItem(SS_UNLOCKED);
  updateAdminViews();
  render();
});

document.getElementById('addBtn').addEventListener('click', function () {
  var date = document.getElementById('fDate').value;
  var title = document.getElementById('fTitle').value.trim();
  var stage = document.getElementById('fStage').value.trim();
  var url = document.getElementById('fUrl').value.trim();
  if (!date || !title || !/^https?:\/\//.test(url)) {
    alert('日付・ライブ名・URL(http で始まる)は必須です');
    return;
  }
  drafts.push({ date: date, title: title, stage: stage, url: url });
  saveDrafts();
  document.getElementById('fTitle').value = '';
  document.getElementById('fStage').value = '';
  document.getElementById('fUrl').value = '';
  state.q = '';
  state.year = 'all';
  document.getElementById('search').value = '';
  buildYearChips();
  render();
});

function csvField(s) {
  s = String(s || '');
  return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

document.getElementById('csvBtn').addEventListener('click', function () {
  var lines = ['date,title,stage,url'];
  state.rows.forEach(function (r) {
    lines.push(csvField(r.date) + ',' + csvField(r.title) + ',' + csvField(r.stage) + ',' + csvField(r.url));
  });
  drafts.forEach(function (d) {
    lines.push(csvField(d.date) + ',' + csvField(d.title) + ',' + csvField(d.stage) + ',' + csvField(d.url));
  });
  var text = lines.join('\n') + '\n';
  var b = document.getElementById('csvBtn');
  function done(ok) {
    b.textContent = ok ? 'コピーしました ✓' : 'コピー失敗';
    setTimeout(function () { b.textContent = 'CSVをコピー'; }, 1500);
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function () { done(true); }, function () { done(false); });
  } else {
    done(false);
  }
});

fetch('data.csv')
  .then(function (r) {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.text();
  })
  .then(function (t) {
    var lines = t.split(/\r?\n/).filter(function (l) { return l.trim() !== ''; });
    var start = 0;
    if (lines.length) {
      var first = parseLine(lines[0]);
      if (/^(date|日付)$/i.test(first[0] || '')) start = 1;
    }
    state.rows = lines.slice(start).map(function (l) {
      var c = parseLine(l);
      return { date: c[0] || '', title: c[1] || '', stage: c[2] || '', url: c[3] || '' };
    }).filter(function (r) { return r.title && r.url; });
    buildYearChips();
    render();
  })
  .catch(function (e) {
    var el = document.getElementById('empty');
    el.hidden = false;
    el.textContent = 'data.csv を読み込めませんでした(' + e.message + ')';
    console.error(e);
  });
</script>
</body>
</html>
